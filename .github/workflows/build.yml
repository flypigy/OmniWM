name: Build OmniWM

on:
  push:
    branches: [main, slim-down]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build and package (ad-hoc signed)
        run: ./Scripts/package-app.sh release dev

      - name: Compile tests (without running)
        run: swift build --build-tests --arch arm64

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --keepParent OmniWM.app "OmniWM-${GITHUB_SHA::7}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniWM-app-${{ github.sha }}
          path: dist/OmniWM-*.zip
          retention-days: 30
