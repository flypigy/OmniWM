name: Build OmniWM

on:
  push:
    branches: [main, slim-down]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Select Xcode with Swift 6.4+
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          for xc in /Applications/Xcode*.app; do
            ver="$xc/Contents/Developer/usr/bin/swift" --version 2>/dev/null | head -1 || true
            echo "$xc -> $ver"
            if "$xc/Contents/Developer/usr/bin/swift" --version 2>/dev/null | grep -qE "Swift version 6\.(4|5|6|7|8|9)|Swift version [7-9]"; then
              echo "Selecting $xc"
              sudo xcode-select -s "$xc/Contents/Developer"
              break
            fi
          done
          swift --version

      - name: Build and package (ad-hoc signed)
        shell: bash
        run: |
          set -o pipefail
          ./Scripts/package-app.sh release dev 2>&1 | tee build.log

      - name: Compile tests (without running)
        shell: bash
        run: |
          set -o pipefail
          swift build --build-tests --arch arm64 2>&1 | tee -a build.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --keepParent OmniWM.app "OmniWM-${GITHUB_SHA::7}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniWM-app-${{ github.sha }}
          path: dist/OmniWM-*.zip
          retention-days: 30
