name: Build OmniWM

on:
  push:
    branches: [main, slim-down, features]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build and package (ad-hoc signed)
        shell: bash
        run: |
          set -o pipefail
          ./Scripts/package-app.sh release dev 2>&1 | tee build.log

      - name: Compile tests (without running)
        shell: bash
        run: |
          set -o pipefail
          swift build --build-tests --arch arm64 2>&1 | tee -a build.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --keepParent OmniWM.app "OmniWM-${GITHUB_SHA::7}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniWM-app-${{ github.sha }}
          path: dist/OmniWM-*.zip
          retention-days: 30
